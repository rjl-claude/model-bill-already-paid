[project]
name = "model-bill-already-paid"
version = "1.0.0"
description = "The bill already paid: UK renewable and low-carbon subsidies and their indirect costs, 2002 to date, scheme by scheme"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billpaid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
