# The publishers' files version 1.2.0 reads for the figures Report No. 2's approved outline asks of the bill already
# paid (aios-harness#235; outline-beats.md, "Missing figures"). Each file is saved here as fetched and refused if its
# sha256 differs. The figures are read from the files by billpaid.outline_sources; none is typed here.
#
# A newer edition of any of these is never picked up by itself: save the new file beside the old, change file and
# sha256 here, rebuild, and measure what moves.
sources:
