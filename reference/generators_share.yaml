# Version 1.6.0 (report-series ADR 0264; Richard, 19 Nov 2026): the part of the generators' share of grid (TNUoS) and
# balancing (BSUoS) charges that is not paid out of subsidy. The line is the generators' share of the cost above the
# gas-led alternative (read from the pinned shared cost register and Report No. 1's release v4-s43, nothing typed),
# times the share of each year's power made by stations with no subsidy (the files below). billpaid.generators_share.
#
# Each file is saved here as fetched and refused if its sha256 differs. A newer edition is never picked up by itself:
# save the new file beside the old, change file and sha256 here, rebuild, and measure what moves.
