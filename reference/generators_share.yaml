# Electricity generated by FIT installations, GWh, each FIT year (April to March, keyed by the year it starts), typed
# from Ofgem's annual reports. `source` names the saved file (here, or in reference/outline_sources.yaml) and `quote`
# the words in it that hold the figure; tests/test_generators_share.py checks each quote is in its file. FIT began on
# 1 April 2010. 2020-21 to 2022-23 are read from the SY14 report's own account of earlier years (to 0.01 TWh).
fit_generation_gwh:
  2010: {gwh: 68.5594, source: ofgem-fit-2010, quote: "Installations generated 68,559.4 MWh"}
  2011: {gwh: 498.2, source: ofgem-fit-2011, quote: "a total of 498.2GWh of electricity was generated"}
  2012: {gwh: 1675, source: ofgem-fit-2012, quote: "£506.3m for 1,675 GWh"}
  2013: {gwh: 2645, source: ofgem-fit-2013, quote: "total generation of 2,645 GWh"}
  2014: {gwh: 3815, source: ofgem-fit-2014, quote: "3,815 GWh of electricity was generated by FIT installations"}
  2015: {gwh: 5593, source: ofgem-fit-gen-2015, quote: "5,593 GWh of electricity was generated by FIT installations"}
  2016: {gwh: 7500, source: ofgem-fit-gen-2016, quote: "7,500 GWh of electricity was"}
  2017: {gwh: 8357, source: ofgem-fit-gen-2017, quote: "8,357 GWh of electricity was generated by FIT installations"}
  2018: {gwh: 8454, source: ofgem-fit-gen-2018, quote: "8,454 GWh (8.45 TWh) of electricity was generated"}
  2019: {gwh: 9133, source: ofgem-fit-gen-2019, quote: "9,133 GWh (9.13 TWh) of electricity was generated"}
  2020: {gwh: 9140, source: ofgem-fit-2023, quote: "(9.14 TWh and £1,547m of"}
  2021: {gwh: 7940, source: ofgem-fit-2023, quote: "dropping to 7.94 TWh of generation"}
  2022: {gwh: 8900, source: ofgem-fit-2023, quote: "SY13 saw generation increase again to 8.90 TWh"}
  2023: {gwh: 8340, source: ofgem-fit-2023, quote: "In SY14, the amount of electricity generated with the support of the FIT was 8.34 TWh"}
  2024: {gwh: 7970, source: ofgem-fit-2024, quote: "In SY15, the amount of electricity generated with the support of the FIT was 7.97 TWh"}
# FIT year 2025-26 (SY16) is not yet reported: April to December 2025 carries SY15 forward (2025 is provisional).
