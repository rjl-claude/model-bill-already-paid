# National Grid's own record of payments to wind farms (aios-harness#266): the Monthly Balancing Services Summary
# (MBSS), section "Payments to Wind Powered Generation", £m cash to one decimal as printed.
#
# EVIDENCE ONLY: no figure of the model reads this file. It cannot replace REF's database like for like for
# 2010-2015 (the report docs/ref-out-2010-2015.md in the model folder on VM 113, aios-harness#266):
#   1. The table first appears in the August 2013 report. 2010/11, 2011/12 and 2012/13 are printed as yearly totals
#      only, so calendar 2010, 2011, 2012 and January-March 2013 cannot be built from months.
#   2. It counts every payment to a wind farm "regardless of the reason", in or out of the Balancing Mechanism.
#      Elexon's record (the model's series from 2016) counts accepted bids in the Balancing Mechanism only.
#
# Each file is NESO's copy as fetched on 19 Nov 2026 (https://www.neso.energy/document/<n>/download; the file names
# NESO serves carry National Grid's old document numbers). Each month is the last figure National Grid printed for
# it: the March report's row of twelve months, or, for January-March 2016, each month's own report.
retrieved: "2026-11-19"
basis: >-
  All payments by National Grid to wind powered generation, whatever the reason, in or out of the Balancing
  Mechanism; financial years April to March; no payments before 2010/11 (the reports' own words).
sources:
  august-2013:
    report: "August 2013 (the first report with the table)"
    what: >-
