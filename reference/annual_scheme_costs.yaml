  constraints_history:
    label: Wind constraint payments (the years before the pin)
    perspectives: [renewables, low_carbon]
    cadence: annual
    source: >-
      2010-2015: National Grid, Monthly Balancing Services Summary, "Payments to Wind Powered Generation", the
      reports of August 2013 to March 2016 as NESO hosts them, retrieved 19 November 2026 and saved with their
      checksums (reference/mbss_wind_payments.yaml). 2016-2023: Elexon's settlement record of accepted wind bids,
      each whole calendar year summed from the model's own store as it stood on 9 November 2026.
    source_url: https://www.neso.energy/document/60941/download
    verified: true
    # First year the daily Elexon feed replaces this history (fix 5 guard, 17 Oct 2026). Changing it is a release
    # decision with a changelog entry. The build refuses 0 or below, and a year later than 2024 while Elexon holds
    # any day of 2024 or later before the pin year.
    bottom_up_from: 2024
    note: >-
      Calendar years, £ cash, primary records only (version 1.5.0, aios-harness#266). 2010-2015 are made from
      National Grid's printed figures by billpaid.mbss: 2014 and 2015 are their twelve printed months; 2010-2013
      hold the April-March totals 2010/11 (£0.2m), 2011/12 (£34.1m) and 2012/13 (£7.6m), which National Grid
      printed without months, spread a quarter to the year they end in and three quarters to the year they start
      in, plus April-December 2013's printed months. National Grid counts every payment to a wind farm, in or out
      of the Balancing Mechanism, and says none was made before 2010/11. 2016-2023 are Elexon's accepted wind bids
      in the Balancing Mechanism, the same record the daily feed carries from the pin (billpaid.elexon_record).
      Tests hold both parts equal to their sources (tests/test_national_grid_constraints.py).
    annual:
