# Versioned reference inputs (spec F-6) for schemes whose official costs are
# published annually rather than via an API. Values are nominal GBP for the
# obligation/scheme year STARTING in the keyed calendar year (RO/FIT years run
# 1 Apr - 31 Mar; constraints_history is calendar-year). Refresh annually;
# cite the exact source consulted.
schemes:
  ro:
    label: Renewables Obligation
    perspectives: [renewables, low_carbon]
    cadence: annual
    source: >-
      Ofgem Renewables Obligation Annual Reports. 2024 (SY23): Annual Report
      2024-25 headline scheme value (PDF, RO_24-25_SY23_Annual_Report,
      Mar 2026). 2010-2023 (SY9-SY22): scheme value = total ROCs presented x
      notional worth of a ROC, Figure A4.1 of the SY22 Annual Report
      (2023-24, PDF, Mar 2025), cross-checked against headline values stated
      in the SY22/SY23 report text (SY1 GBP 0.25bn, SY18 GBP 6.31bn, SY19
      GBP 5.73bn, SY22 GBP 6.75bn, SY23 GBP 7.70bn). 2002-2009 (SY1-SY8):
      ROCs presented x worth of a ROC from the compliance tables of Ofgem's
      second annual report (2003-04, Feb 2005), the RO Annual Report
      2004-2005 (Feb 2006), the RO Annual Report 2008-09 (Feb 2010) and the
      RO Annual Report 2010-11 (Mar 2012).
    source_url: https://www.ofgem.gov.uk/transparency-document/renewables-obligation-ro-annual-report-scheme-year-22-april-2023-march-2024
    verified: true
    expected_next_update: 2027-03-01   # Ofgem RO Annual Report, published ~March; SY24 (2025) needs compliance to complete autumn 2026
    note: >-
      Scheme value = ROCs presented for compliance x notional worth of a ROC
      (buy-out price + recycle value), Ofgem's own definition of the annual
      value of the scheme. Where Ofgem states a headline value it is used
      directly; otherwise values are computed from Ofgem's published ROC and
      worth figures and rounded down to the nearest GBP 10m (never
      overstated). 2025 (SY24, 2025-26) is omitted: compliance completes
      autumn 2026 and no official outturn or forecast of scheme value has
      been published yet. RO mutualisation is counted (D-08; Richard, 1 Nov
      2026; aios-harness#45): the payments suppliers received to make good
      the shortfalls of scheme years 2017-21 (GBP 525.5m; GB, NI was not
      mutualised), from the shared cost register's RO_MUT line, added to
      the scheme year each makes good.
    annual:
      2002: 250000000
      2003: 400000000
      2004: 490000000
      2005: 580000000
      2006: 720000000
      2007: 870000000
      2008: 1030000000
      2009: 1110000000
      2010: 1280000000
      2011: 1450000000
      2012: 1980000000
      2013: 2590000000
      2014: 3110000000
      2015: 3740000000
      2016: 4490000000
      2017: 5357755439.0   # 5.30bn scheme value + 57.8m mutualisation received
      2018: 6017282547.83   # 5.92bn scheme value + 97.3m mutualisation received
      2019: 6342546376.96   # 6.31bn scheme value + 32.5m mutualisation received
      2020: 5948284888.45   # 5.73bn scheme value + 218.3m mutualisation received
      2021: 6479668289.59   # 6.36bn scheme value + 119.7m mutualisation received
      2022: 6430000000
      2023: 6750000000
      2024: 7700000000
  fit:
    label: Feed-in Tariffs
    perspectives: [renewables, low_carbon]
    cadence: annual
    source: >-
      The shared cost register (reference/register_pin.yaml), line FIT: the
      levelisation fund cost, what licensed suppliers paid in, by scheme year
      (April-March, keyed by start year), GB (no FiT scheme in Northern
      Ireland), from Ofgem's FiT annual reports (SY1-5, SY14-15) and annual
      levelisation notices (2015-16 to 2022-23); includes correction C-008.
      Valued as the levelisation fund, as Reliable Britain does (0084;
      Richard, 1 Nov 2026; aios-harness#45), not Ofgem's scheme value.
    source_url: https://www.ofgem.gov.uk/transparency-document/feed-tariffs-annual-report-scheme-year-15-april-2024-march-2025
    verified: true
    expected_next_update: 2027-01-31   # Ofgem FiT annual report / levelisation notice
    note: >-
      The build reads every closed year from the shared cost register; the
      figures below are the register's, copied here so the file says what the
      Clock counts. Each scheme year sits in its own year (the 2019-20 and
      2022-23 values were swapped until aios-harness#42). 2025 (SY16) is
      omitted until published.
